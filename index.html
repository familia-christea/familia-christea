<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,sans-serif;background:#FFF8F0;max-width:480px;margin:0 auto;min-height:100vh}

/* LANDSCAPE MODE */
@media (orientation:landscape) and (max-height:500px){
  body{max-width:100%;display:flex;flex-direction:column;}
  
  /* Header menor */
  #root > div:first-child{padding:8px 20px !important;}
  #root > div:first-child > div:first-child{font-size:18px !important;}
  #root > div:first-child > div:last-child{font-size:10px !important;margin-top:0 !important;}
  
  /* Tabs menores */
  #root > div:nth-child(2) button{padding:6px 4px !important;font-size:11px !important;}
  #root > div:nth-child(2) button > div{font-size:14px !important;}
  
  /* Content area - two column layout */
  #root > div:nth-child(3){
    padding:10px !important;
    display:grid !important;
    grid-template-columns:1fr 1fr !important;
    gap:10px !important;
    align-items:start !important;
    padding-bottom:60px !important;
  }

  /* Hero cards side by side already, make them smaller */
  #root > div:nth-child(3) > div[style*="grid"]{
    grid-column:1 / -1 !important;
  }
  
  /* FAB repositioning */
  button[style*="position:fixed;bottom:24px;right:24px"]{
    bottom:12px !important;right:12px !important;width:44px !important;height:44px !important;font-size:20px !important;
  }
  button[style*="position:fixed;bottom:24px;left:24px"]{
    bottom:12px !important;left:12px !important;width:36px !important;height:36px !important;font-size:16px !important;
  }

  /* Toast higher */
  #toast{top:50px !important;}
  #goal-banner{padding:8px 16px !important;font-size:14px !important;}
}

@media (orientation:landscape) and (min-width:600px){
  body{max-width:100% !important;}
}
.fr{font-family:'Fredoka One',cursive}
button{cursor:pointer;font-family:Nunito,sans-serif}
button:active{opacity:.8}
::-webkit-scrollbar{display:none}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-120px);background:linear-gradient(135deg,#ff6b9d,#c94080);color:#fff;padding:10px 22px;border-radius:999px;font-weight:800;font-size:14px;z-index:9999;white-space:nowrap;transition:transform .4s}
#toast.show{transform:translateX(-50%) translateY(0)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.sdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.7);animation:pulse 1s infinite;display:inline-block;margin-left:6px;vertical-align:middle}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}
.inp{width:100%;padding:9px 12px;border-radius:12px;border:2px solid #e8e8e8;font-family:Nunito,sans-serif;font-size:14px;font-weight:700;outline:none;margin-top:4px}
.lbl{font-size:12px;font-weight:800;color:#666;display:block;margin-top:12px}
</style>
</head>

function checkMonthReset(){
  var now = new Date();
  var monthKey = now.getFullYear()+"-"+(now.getMonth()+1);
  var lastMonth = localStorage.getItem("christea_month");
  if(lastMonth && lastMonth !== monthKey){
    // New month! Reset monthly done tracking
    S.monthDone = {};
    cloudSave();
    toast("Novo mes! Pontuacao mensal zerada!");
  }
  localStorage.setItem("christea_month", monthKey);
}
async function cloudLoad(){
  var key=localStorage.getItem("ckey"),bin=localStorage.getItem("cbin");
  if(!key||!bin)return;
  try{
    var r=await fetch("https://api.jsonbin.io/v3/b/"+bin+"/latest",{headers:{"X-Master-Key":key,"X-Bin-Meta":"false"}});
    if(!r.ok)return;
    var d=await r.json();
    if(d.tasks)S.tasks=d.tasks;if(d.rewards)S.rewards=d.rewards;
    if(d.done)S.done=d.done;if(d.history)S.history=d.history;
    if(d.monthDone)S.monthDone=d.monthDone;
    if(d.negatives)S.negatives=d.negatives;
    if(d.negHistory)S.negHistory=d.negHistory;
    if(d.agenda)S.agenda=d.agenda;
    if(d.agendaDone)S.agendaDone=d.agendaDone;
    if(d.notes)localStorage.setItem("christea_notes",JSON.stringify(d.notes));
    render();
  }catch(e){}
}
async function cloudSave(){
  var key=localStorage.getItem("ckey"),bin=localStorage.getItem("cbin");
  saveLocal();
  if(!key||!bin)return;
  dot(true);
  var notes=JSON.parse(localStorage.getItem("christea_notes")||"[]");

}

// HELPERS
function today(){return new Date().getDay();}
function todayKey(){return new Date().toISOString().slice(0,10);}
function tasksForDay(d){return S.tasks.filter(function(t){return t.days&&t.days.includes(d);});}
function vTasks(){return tasksForDay(today()).filter(function(t){return t.who==="vit"||t.who==="both";});}
function pTasks(){return tasksForDay(today()).filter(function(t){return t.who==="ped"||t.who==="both";});}
function vPts(){
  var pos=vTasks().reduce(function(s,t){return s+(S.done[t.id]?t.pts:0);},0);
  var neg=getDayNegPts(todayKey(),"vit");
  return Math.max(0,pos-neg);
}
function pPts(){
  var pos=pTasks().reduce(function(s,t){return s+(S.done[t.id]?t.pts:0);},0);
  var neg=getDayNegPts(todayKey(),"ped");
  return Math.max(0,pos-neg);
}
function vGoal(){return vTasks().reduce(function(s,t){return s+t.pts;},0)||100;}
function pGoal(){return pTasks().reduce(function(s,t){return s+t.pts;},0)||60;}
function pct(v,g){return Math.min(100,g>0?Math.round(v/g*100):0);}
function lvl(p){
  if(p<0.25)return E.sprout+" Iniciante";
  if(p<0.5)return E.bolt+" Explorador";
  if(p<0.75)return E.gstar+" Heroi";
  return E.crown+" Lendario";
}
function getDayNegPts(dayKey,who){
  var entries=(S.negHistory||{})[dayKey]||[];
  return entries.reduce(function(s,e){
    if(e.who===who||e.who==="both")return s+e.pts;
    return s;
  },0);
}

function registerNeg(negId,who){
  var neg=S.negatives.find(function(n){return n.id===negId;});

  if(!S.negHistory)S.negHistory={};

// ── SONS ──────────────────────────────────────────────────
function playSound(type){
  try {
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    
    if(type==="task"){
      // Ding simples - tarefa concluida
      var osc=ctx.createOscillator();
      var gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(880,ctx.currentTime);
      osc.frequency.setValueAtTime(1100,ctx.currentTime+0.1);
      gain.gain.setValueAtTime(0.9,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
      osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.3);
    }
    
    if(type==="daily"){
      // Fanfarra curta - meta do dia batida!
      var notes=[523,659,784,1047];
      notes.forEach(function(freq,i){
        var osc=ctx.createOscillator();
        var gain=ctx.createGain();
        osc.connect(gain);gain.connect(ctx.destination);
        osc.type="square";
        osc.frequency.setValueAtTime(freq,ctx.currentTime+i*0.12);
        gain.gain.setValueAtTime(0.85,ctx.currentTime+i*0.12);
        gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.12+0.15);
        osc.start(ctx.currentTime+i*0.12);
        osc.stop(ctx.currentTime+i*0.12+0.15);
      });
    }
    
    if(type==="monthly"){
      // Celebracao epica - meta do mes batida!
      var melody=[523,659,784,659,784,1047,784,1047,1319];
      melody.forEach(function(freq,i){
        var osc=ctx.createOscillator();
        var gain=ctx.createGain();
        var osc2=ctx.createOscillator();
        var gain2=ctx.createGain();
        osc.connect(gain);gain.connect(ctx.destination);
        osc2.connect(gain2);gain2.connect(ctx.destination);
        osc.type="sine";
        osc2.type="triangle";
        var t=ctx.currentTime+i*0.15;
        osc.frequency.setValueAtTime(freq,t);
        osc2.frequency.setValueAtTime(freq*2,t);
        gain.gain.setValueAtTime(0.9,t);
        gain.gain.exponentialRampToValueAtTime(0.001,t+0.18);
        gain2.gain.setValueAtTime(0.1,t);
        gain2.gain.exponentialRampToValueAtTime(0.001,t+0.18);
        osc.start(t);osc.stop(t+0.2);
        osc2.start(t);osc2.stop(t+0.2);
      });
    }

    if(type==="negative"){
      // Som grave - comportamento negativo
      var osc=ctx.createOscillator();
      var gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type="sawtooth";
      osc.frequency.setValueAtTime(200,ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80,ctx.currentTime+0.3);
      gain.gain.setValueAtTime(0.85,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
      osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.35);
    }
    
    setTimeout(function(){ctx.close();},2000);
  } catch(e){}
}

    setTimeout(function(){
      playSound("daily");
      showBanner("Meta do dia batida, Pedro! "+E.rocket+" "+E.tada, "#4ECDC4");
    },300);
  } else if(pp<pg_p){ _goalCelebrated.pedDaily=false; }

  // Monthly goals

      showBanner("META DO MES BATIDA, VITORIA! "+E.flower+E.star+E.tada, "#FF6B9D");

      playSound("monthly");
      showBanner("META DO MES BATIDA, PEDRO! "+E.rocket+E.star+E.tada, "#4ECDC4");
    },500);
  }
}

  else if(Array.isArray(children))children.forEach(function(c){if(c)d.appendChild(c);});

}

function getDayPts(dayKey, who){
  var dm=S.history[dayKey]||{};
  return S.tasks.reduce(function(s,t){
    if(!dm[t.id])return s;
    if(who==="vit"&&(t.who==="vit"||t.who==="both"))return s+t.pts;
    if(who==="ped"&&(t.who==="ped"||t.who==="both"))return s+t.pts;
    return s;
  },0);
}

function nowMin_(){ var n=new Date(); return n.getHours()*60+n.getMinutes(); }

function sendToSW(msg){
  if(!window._swReg) return;
  var sw = window._swReg.active || window._swReg.installing || window._swReg.waiting;
  if(sw) sw.postMessage(msg);
}

function handleNotificationAction(action, data){
  var agendaId = data.agendaId;
  var notifType = data.notifType||"";
  var url = window.location.href.split("?")[0];

  if(action==="started"){
    toast("Otimo! Atividade iniciada!");
    playSound("task");
    var item=(S.agenda||[]).find(function(a){return a.id===agendaId;});
    if(item){
      var whoName=item.who==="vit"?"Vitoria":item.who==="ped"?"Pedro":"Vitoria e Pedro";
      sendToSW({
        type:"SCHEDULE",
        title:item.icon+" TERMINOU: "+item.name,
        body:whoName+" | A atividade foi concluida?",
        tag:"end_"+item.id,
        delay:item.dur*60000,
        actions:[{action:"done",title:"Concluido!"},{action:"moretime",title:"Mais 15 minutos"}],
        payload:{agendaId:agendaId,notifType:"end",origin:window.location.origin}
      });
    }
  }

  if(action==="done"){
    var dk=new Date().toISOString().slice(0,10);
    if(!S.agendaDone)S.agendaDone={};
    if(!S.agendaDone[dk])S.agendaDone[dk]={};
    S.agendaDone[dk][agendaId]=true;
    cloudSave();render();
    playSound("daily");
    showBanner("Atividade concluida! Parabens!", "#4CAF50");
  }

  if(action==="snooze"){
    var item2=(S.agenda||[]).find(function(a){return a.id===agendaId;});
    if(item2){
      var whoName2=item2.who==="vit"?"Vitoria":item2.who==="ped"?"Pedro":"Vitoria e Pedro";
      sendToSW({
        type:"SCHEDULE",
        title:item2.icon+" Lembrete: "+item2.name,
        body:whoName2+" | Adiado 5 minutos",
        tag:"snooze_"+item2.id,
        delay:5*60000,
        actions:[{action:"started",title:"Iniciou!"},{action:"snooze",title:"Adiar mais 5min"}],
        payload:{agendaId:agendaId,notifType:"start",origin:window.location.origin,dur:item2.dur}
      });
      toast("Adiado 5 minutos!");
    }
  }

  if(action==="moretime"){
    var item3=(S.agenda||[]).find(function(a){return a.id===agendaId;});
    if(item3){
      var whoName3=item3.who==="vit"?"Vitoria":item3.who==="ped"?"Pedro":"Vitoria e Pedro";
      sendToSW({
        type:"SCHEDULE",
        title:item3.icon+" Terminou: "+item3.name,
        body:whoName3+" | A atividade foi concluida agora?",
        tag:"end2_"+item3.id,
        delay:15*60000,
        actions:[{action:"done",title:"Sim, concluido!"},{action:"moretime",title:"Mais 15min"}],
        payload:{agendaId:agendaId,notifType:"end",origin:window.location.origin}
      });
      toast("Ok! Verificamos em 15 minutos.");
    }
  }
}

function scheduleAgendaNotifications(){
  if(!window._swReg||Notification.permission!=="granted")return;
  var td=new Date().getDay();
  var nowM=nowMin_();
  var url=window.location.href.split("?")[0];

  (S.agenda||[]).forEach(function(item){
    if(!item.days.includes(td))return;
    var startMin=timeToMin(item.startH,item.startM);
    var endMin=startMin+item.dur;
    var endTime=addMin(item.startH,item.startM,item.dur);
    var whoName=item.who==="vit"?"Vitoria":item.who==="ped"?"Pedro":"Vitoria e Pedro";

    // 5 min warning
    var warnMin=startMin-5;
    if(warnMin>nowM){
      sendToSW({type:"SCHEDULE",
        title:"Em 5 min: "+item.icon+" "+item.name,
        body:whoName+" | Comeca as "+fmtTime(item.startH,item.startM)+" por "+fmtDur(item.dur),
        tag:"warn_"+item.id,delay:(warnMin-nowM)*60000,
        actions:[{action:"ok",title:"Entendido!"},{action:"dismiss",title:"Fechar"}],
        payload:{agendaId:item.id,notifType:"warn",origin:url}
      });
    }
    // Start
    if(startMin>nowM){
      sendToSW({type:"SCHEDULE",
        title:item.icon+" HORA DE: "+item.name+"!",
        body:whoName+" | "+fmtDur(item.dur)+" | Termina as "+fmtTime(endTime.h,endTime.m),
        tag:"start_"+item.id,delay:(startMin-nowM)*60000,
        actions:[{action:"started",title:"Iniciou!"},{action:"snooze",title:"Adiar 5min"}],
        payload:{agendaId:item.id,notifType:"start",origin:url,dur:item.dur}
      });
    }
    // End
    if(endMin>nowM){
      sendToSW({type:"SCHEDULE",
        title:item.icon+" TERMINOU: "+item.name,
        body:whoName+" | A atividade foi concluida?",
        tag:"end_"+item.id,delay:(endMin-nowM)*60000,
        actions:[{action:"done",title:"Concluido!"},{action:"moretime",title:"Mais 15 minutos"}],
        payload:{agendaId:item.id,notifType:"end",origin:url}
      });
    }
  });
  console.log("Notificacoes agendadas!");
}

var _agendaAlerted = {};
var _agendaInterval = null;

function timeToMin(h,m){ return h*60+m; }
function nowMin(){ var n=new Date(); return n.getHours()*60+n.getMinutes(); }
function fmtTime(h,m){ return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
function fmtDur(min){
  if(min<60)return min+"min";
  var h=Math.floor(min/60),m=min%60;
  return h+"h"+(m>0?m+"min":"");
}
function addMin(h,m,dur){
  var total=h*60+m+dur;
  return {h:Math.floor(total/60)%24, m:total%60};
}

function getAgendaStatus(item){
  var now=nowMin();
  var start=timeToMin(item.startH,item.startM);
  var end=start+item.dur;
  if(now<start-5)return "upcoming";
  if(now>=start-5&&now<start)return "soon";
  if(now>=start&&now<end)return "active";
  return "done";
}

function checkAgendaAlerts(){
  var td=new Date().getDay();
  var now=nowMin();
  (S.agenda||[]).forEach(function(item){
    if(!item.days.includes(td))return;
    var start=timeToMin(item.startH,item.startM);
    var end=start+item.dur;
    var dk=new Date().toISOString().slice(0,10);
    var doneKey=dk+"_"+item.id;

    // 5 min warning
    var warnKey="warn_"+doneKey;
    if(now===start-5&&!_agendaAlerted[warnKey]){
      _agendaAlerted[warnKey]=true;
      playSound("task");
      showBanner("Em 5 min: "+item.icon+" "+item.name+" ("+fmtTime(item.startH,item.startM)+")", item.color||"#667eea");
    }
    // Start alert
    var startKey="start_"+doneKey;
    if(now===start&&!_agendaAlerted[startKey]){
      _agendaAlerted[startKey]=true;
      playSound("daily");
      showBanner("Hora de: "+item.icon+" "+item.name+"!", item.color||"#667eea");
    }
    // End alert
    var endKey="end_"+doneKey;
    if(now===end&&!_agendaAlerted[endKey]){
      _agendaAlerted[endKey]=true;
      playSound("negative");
      showBanner("Terminou: "+item.icon+" "+item.name, "#888");
    }
  });
}

function startAgendaTimer(){
  if(_agendaInterval)return;
  _agendaInterval=setInterval(function(){
    checkAgendaAlerts();
    if(UI.tab==="agenda")render();
  },30000); // check every 30s
}

// MONTHLY HISTORY
function buildMonthly(parent){
  // Build list of months from history keys
  var monthMap={};
  Object.keys(S.history).forEach(function(dateKey){
    var parts=dateKey.split("-");
    if(parts.length<2)return;
    var mk=parts[0]+"-"+parts[1];
    if(!monthMap[mk])monthMap[mk]={vPts:0,pPts:0,vTasks:0,pTasks:0,days:0};
    var dm=S.history[dateKey];
    S.tasks.forEach(function(t){
      if(!dm[t.id])return;
      if(t.who==="vit"||t.who==="both"){monthMap[mk].vPts+=t.pts;monthMap[mk].vTasks++;}
      if(t.who==="ped"||t.who==="both"){monthMap[mk].pPts+=t.pts;monthMap[mk].pTasks++;}
    });
    monthMap[mk].days++;
  });

  var months=Object.keys(monthMap).sort().reverse();

  var ttl=div("font-size:18px;color:#888;margin-bottom:12px");ttl.className="fr";
  ttl.textContent="Historico Mensal";
  parent.appendChild(ttl);

  if(months.length===0){
    var empty=div("background:white;border-radius:20px;padding:30px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.07)");
    var ei=div("font-size:40px;margin-bottom:10px");ei.textContent="\uD83D\uDCC5";
    var et=div("font-size:15px;color:#bbb;font-weight:700");et.textContent="Nenhum historico mensal ainda";
    var es=div("font-size:12px;color:#ddd;font-weight:700;margin-top:6px");es.textContent="Os dados aparecerao aqui conforme o tempo passar";
    empty.appendChild(ei);empty.appendChild(et);empty.appendChild(es);
    parent.appendChild(empty);
    return;
  }

  var MONTH_NAMES=["Janeiro","Fevereiro","Marco","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  var now=new Date();
  var curMK=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");

  months.forEach(function(mk){
    var m=monthMap[mk];
    var parts=mk.split("-");
    var year=parts[0]||"";
    var monthNum=parseInt(parts[1]||"1")-1;
    if(monthNum<0||monthNum>11)monthNum=0;

    // Stats row

    [["Vitoria","#FF6B9D","#fff0f6",m.vPts,m.vTasks],["Pedro","#4ECDC4","#f0fffe",m.pPts,m.pTasks]].forEach(function(info){
      var cc=div("flex:1;background:"+info[2]+";border-radius:14px;padding:12px 8px;text-align:center");
      var cn=div("font-size:12px;font-weight:800;color:"+info[1]);cn.textContent=info[0];
      var cpts=div("font-size:24px;color:"+info[1]);cpts.className="fr";cpts.textContent=String(info[3]);
      var cptsl=div("font-size:10px;color:#bbb;font-weight:700");cptsl.textContent="pontos";
      var csep=div("width:30px;height:2px;background:"+info[1]+"33;margin:5px auto");
      var ctasks=div("font-size:13px;font-weight:800;color:"+info[1]);ctasks.textContent=info[4]+" tarefas";
      cc.appendChild(cn);cc.appendChild(cpts);cc.appendChild(cptsl);cc.appendChild(csep);cc.appendChild(ctasks);
      srow.appendChild(cc);
    });
    card.appendChild(srow);

    // Progress bar total
    var totalPts=m.vPts+m.pPts;
    var daysActive=m.days;
    var footer=div("display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#aaa");
    var fl=span("",""+daysActive+" dias com atividade");
    var fr2=span("","Total: "+totalPts+" pts");
    footer.appendChild(fl);footer.appendChild(fr2);
    card.appendChild(footer);

    parent.appendChild(card);
  });
}

// RECADOS
function buildRecados(parent){
  var notes = JSON.parse(localStorage.getItem("christea_notes")||"[]");

  var hdr=div("display:flex;justify-content:space-between;align-items:center;margin-bottom:14px");
  var ttl=div("font-size:18px;color:#888");ttl.className="fr";ttl.textContent="Recados da Familia";
  hdr.appendChild(ttl);parent.appendChild(hdr);

  // New note form
  var form=div("background:white;border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.07)");
  var ftitle=div("font-size:14px;font-weight:800;color:#555;margin-bottom:10px");ftitle.textContent="Novo Recado";
  
  // Author selector
  var authorRow=div("display:flex;gap:8px;margin-bottom:10px");
  var authors=[["Pai","#667eea"],["Mae","#FF6B9D"],["Vitoria","#FFB800"],["Pedro","#4ECDC4"]];
  var selAuthor="Pai";
  authors.forEach(function(a){
    var ab=btn("flex:1;padding:6px 4px;border-radius:10px;border:2px solid "+(a[0]==="Pai"?a[1]:"#e0e0e0")+";background:"+(a[0]==="Pai"?a[1]:"white")+";color:"+(a[0]==="Pai"?"white":"#888")+";font-weight:800;font-size:12px",a[0],function(aa){return function(){
      selAuthor=aa[0];
      authorRow.querySelectorAll("button").forEach(function(x){x.style.background="white";x.style.color="#888";x.style.borderColor="#e0e0e0";});
      event.target.style.background=aa[1];event.target.style.color="white";event.target.style.borderColor=aa[1];
    };}(a));
    authorRow.appendChild(ab);
  });

  var ta=document.createElement("textarea");
  ta.placeholder="Escreva um recado, observacao ou lembrança...";
  ta.style.cssText="width:100%;padding:10px 12px;border-radius:12px;border:2px solid #e8e8e8;font-family:Nunito,sans-serif;font-size:14px;font-weight:700;outline:none;resize:none;height:80px;margin-bottom:10px";
  
  var sendBtn=btn("width:100%;padding:11px;border-radius:12px;border:none;background:linear-gradient(135deg,#ff6b9d,#c94080);color:white;font-family:Nunito,sans-serif;font-weight:800;font-size:14px","Enviar Recado",function(){
    var text=ta.value.trim();
    if(!text)return;
    var note={id:Date.now(),author:selAuthor,text:text,date:new Date().toLocaleDateString("pt-BR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})};
    notes.unshift(note);
    localStorage.setItem("christea_notes",JSON.stringify(notes.slice(0,50)));
    ta.value="";
    toast("Recado enviado!");
    cloudSave();render();
  });

  form.appendChild(ftitle);form.appendChild(authorRow);form.appendChild(ta);form.appendChild(sendBtn);
  parent.appendChild(form);

  // Notes list
  if(notes.length===0){
    var empty=div("text-align:center;padding:30px;color:#bbb;font-weight:700;font-size:15px");
    empty.textContent="Nenhum recado ainda. Seja o primeiro!";
    parent.appendChild(empty);
    return;
  }

  notes.forEach(function(n){
    var authorColors={"Pai":"#667eea","Mae":"#FF6B9D","Vitoria":"#FFB800","Pedro":"#4ECDC4"};
    var authorEmojis={"Pai":"👨","Mae":"👩","Vitoria":"👸","Pedro":"🦸"};
    var color=authorColors[n.author]||"#888";
    var card=div("background:white;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 3px 14px rgba(0,0,0,.06);border-left:4px solid "+color);
    var top=div("display:flex;justify-content:space-between;align-items:center;margin-bottom:8px");
    var auth=div("display:flex;align-items:center;gap:6px");
    var emoji=span("font-size:18px",authorEmojis[n.author]||"👤");
    var aname=div("font-weight:800;font-size:15px;color:"+color);aname.textContent=n.author;
    var delBtn=btn("background:none;border:none;color:#ddd;font-size:14px;padding:2px 4px","✕",function(nid){return function(){
      var notes2=JSON.parse(localStorage.getItem("christea_notes")||"[]");
      notes2=notes2.filter(function(x){return x.id!==nid;});
      localStorage.setItem("christea_notes",JSON.stringify(notes2));
      toast("Recado removido!");cloudSave();render();
    };}(n.id));
    var dt=div("font-size:10px;color:#bbb;font-weight:700");dt.textContent=n.date;
    auth.appendChild(emoji);auth.appendChild(aname);
    top.appendChild(auth);top.appendChild(delBtn);
    var txt=div("font-size:15px;color:#444;font-weight:600;line-height:1.5");txt.textContent=n.text;
    var bot=div("margin-top:6px");bot.appendChild(dt);
    card.appendChild(top);card.appendChild(txt);card.appendChild(bot);
    parent.appendChild(card);
  });
}

// GENERATE APP ICON via Canvas
(function(){
  try {
    var c = document.createElement("canvas");
    c.width = 192; c.height = 192;
    var ctx = c.getContext("2d");
    // Gradient background
    var g = ctx.createLinearGradient(0,0,0,192);
    g.addColorStop(0,"#FF6B9D");
    g.addColorStop(1,"#c94080");
    // Rounded rect
    ctx.beginPath();
    ctx.moveTo(30,0);ctx.lineTo(162,0);
    ctx.quadraticCurveTo(192,0,192,30);
    ctx.lineTo(192,162);
    ctx.quadraticCurveTo(192,192,162,192);
    ctx.lineTo(30,192);
    ctx.quadraticCurveTo(0,192,0,162);
    ctx.lineTo(0,30);
    ctx.quadraticCurveTo(0,0,30,0);
    ctx.closePath();
    ctx.fillStyle=g;ctx.fill();
    // Trophy emoji
    ctx.font="110px serif";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("\uD83C\uDFC6",96,90);
    // Stars below
    ctx.font="28px serif";
    ctx.fillText("\u2B50\u2B50\u2B50",96,158);
    // Set as apple touch icon
    var url = c.toDataURL("image/png");
    var link = document.querySelector("link[rel='apple-touch-icon']");
    if(link) link.href = url;
    // Also set favicon
    var fav = document.querySelector("link[rel='icon']");
    var fav2 = document.createElement("link");
    fav2.rel="shortcut icon"; fav2.href=url;
    document.head.appendChild(fav2);
  } catch(e){}
})();

// INIT - wrapped in DOMContentLoaded to ensure all functions are defined
window.addEventListener("DOMContentLoaded", function(){
  loadLocal();
  render();
  startAgendaTimer();
  // SW and notifications with safety check
  if("serviceWorker" in navigator){
    registerServiceWorker();
  }
  if("Notification" in window && Notification.permission !== "denied"){
    requestNotificationPermission();
  }
  setTimeout(function(){
    scheduleAgendaNotifications();
  }, 2500);
});

// ── SERVICE WORKER + PUSH NOTIFICATIONS ──────────────────────
function requestNotificationPermission(){
  if(!("Notification" in window))return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(function(perm){
      if(perm==="granted") toast("Notificacoes ativadas!");
    });
  }
}

function registerServiceWorker(){
  if(!("serviceWorker" in navigator)||!navigator.serviceWorker)return;
  try{
  navigator.serviceWorker.register("sw.js", {scope:"./"})
    .then(function(reg){
      window._swReg = reg;
      console.log("SW registered OK");
      // Listen for messages from SW
      navigator.serviceWorker.addEventListener("message", function(e){
        if(!e.data) return;
        if(e.data.type === "NOTIF_ACTION"){
          handleNotificationAction(e.data.action, e.data.payload);
        }
        if(e.data.type === "NOTIF_DISMISSED"){
          console.log("Notif dismissed:", e.data.payload);
        }
      });
    })
    .catch(function(err){ console.log("SW error:", err); });
  }catch(e){ console.log("SW exception:", e); }
}
